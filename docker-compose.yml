version: "3.9"

# =========================================================
# docker-compose.yml - plataforma_lc_digital_cn
# Levanta: 6 Bases de Datos MySQL + Eureka + Admin
# + API Gateway + 6 Microservicios
# + RabbitMQ Cluster (2 nodos con failover)
# + Kafka Cluster (3 Brokers KRaft) + Admin Kafka
# =========================================================

services:
  # ---------------- BASES DE DATOS INDIVIDUALES ----------------
  mysql-estudiante:
    image: mysql:8.0
    container_name: mysql-estudiante
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: estudiante
    ports:
      - "3307:3306"
    volumes:
      - mysql_estudiante_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  mysql-curso:
    image: mysql:8.0
    container_name: mysql-curso
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curso
    ports:
      - "3308:3306"
    volumes:
      - mysql_curso_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  mysql-asistencia:
    image: mysql:8.0
    container_name: mysql-asistencia
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asistencia
    ports:
      - "3309:3306"
    volumes:
      - mysql_asistencia_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  mysql-evaluaciones:
    image: mysql:8.0
    container_name: mysql-evaluaciones
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evaluaciones
    ports:
      - "3310:3306"
    volumes:
      - mysql_evaluaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  mysql-justificativos:
    image: mysql:8.0
    container_name: mysql-justificativos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: justificativos
    ports:
      - "3311:3306"
    volumes:
      - mysql_justificativos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  mysql-anotaciones:
    image: mysql:8.0
    container_name: mysql-anotaciones
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anotaciones
    ports:
      - "3312:3306"
    volumes:
      - mysql_anotaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plataforma-net

  # ---------------- SERVICE DISCOVERY ----------------
  eureka-server:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_infra/eurekaServer/Dockerfile.eurekaServer
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
    networks:
      - plataforma-net

  # ---------------- MENSAJERIA: RABBITMQ CLUSTER (2 nodos) ----------------
  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "plataforma_lc_secret_cookie"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - plataforma-net

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "plataforma_lc_secret_cookie"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      - rabbitmq-1
    networks:
      - plataforma-net

  # ---------------- MONITOREO ----------------
  admin-server:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_infra/adminSpringBoot/Dockerfile.adminSpringBoot
    container_name: admin-server
    restart: unless-stopped
    ports:
      - "8062:8062"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
    depends_on:
      - eureka-server
    networks:
      - plataforma-net

  # ---------------- API GATEWAY ----------------
  api-gateway:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_infra/apiGateway/Dockerfile.apiGateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://login.microsoftonline.com/2dcf78c8-4359-4115-8b06-50c5a455e4e0/v2.0
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka-server
    networks:
      - plataforma-net

  # ---------------- MICROSERVICIOS DE NEGOCIO ----------------
  estudiante:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/estudiante/Dockerfile.estudiante
    container_name: estudiante
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-estudiante:3306/estudiante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
      RABBITMQ_SIMULACION_FALLOS_HABILITADA: "true"
    depends_on:
      mysql-estudiante:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  curso:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/curso/Dockerfile.curso
    container_name: curso
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-curso:3306/curso?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      mysql-curso:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  asistencia:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/asistencia/Dockerfile.asistencia
    container_name: asistencia
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-asistencia:3306/asistencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_CURSO_URL: http://curso:8081
      MS_ESTUDIANTE_URL: http://estudiante:8080
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
      RABBITMQ_SIMULACION_FALLOS_HABILITADA: "true"
    depends_on:
      mysql-asistencia:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  evaluaciones:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/evaluaciones/Dockerfile.evaluaciones
    container_name: evaluaciones
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-evaluaciones:3306/evaluaciones?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MS_CURSO_URL: http://curso:8081
      MS_ESTUDIANTE_URL: http://estudiante:8080
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      mysql-evaluaciones:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  justificativos:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/justificativos/Dockerfile.justificativos
    container_name: justificativos
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-justificativos:3306/justificativos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
      RABBITMQ_SIMULACION_FALLOS_HABILITADA: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      APP_KAFKA_TOPIC_AUDIT: audit-events-v1
      APP_KAFKA_SERVICIO_ORIGEN: justificativos-service
    depends_on:
      mysql-justificativos:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
      kafka-1: # <-- Garantiza que Kafka haya iniciado antes que justificativos
        condition: service_started
    networks:
      - plataforma-net

  anotaciones:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_gestion/anotaciones/Dockerfile.anotaciones
    container_name: anotaciones
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-anotaciones:3306/anotaciones?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      mysql-anotaciones:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  admin-rabbitmq:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_infra/adminRabbitMQ/Dockerfile
    container_name: admin-rabbitmq
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      eureka-server:
        condition: service_started
      rabbitmq-1:
        condition: service_started
    networks:
      - plataforma-net

  # ---------------- KAFKA CLUSTER (3 Brokers con KRaft) ----------------
  kafka-1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      - plataforma-net

  kafka-2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    depends_on:
      - kafka-1
    networks:
      - plataforma-net

  kafka-3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    depends_on:
      - kafka-1
    networks:
      - plataforma-net

  # ---------------- ADMIN KAFKA ----------------
  admin-kafka:
    build:
      context: .
      dockerfile: ./plataforma_lc/sistema_infra/adminKafka/Dockerfile.adminKafka
    container_name: admin-kafka
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    networks:
      - plataforma-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8040:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: plataforma-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - plataforma-net

networks:
  plataforma-net:
    driver: bridge

volumes:
  mysql_estudiante_data:
  mysql_curso_data:
  mysql_asistencia_data:
  mysql_evaluaciones_data:
  mysql_justificativos_data:
  mysql_anotaciones_data:
  rabbitmq_data_1:
  rabbitmq_data_2:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
