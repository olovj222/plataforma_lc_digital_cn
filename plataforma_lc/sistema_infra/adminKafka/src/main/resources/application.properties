# =========================================================
# CONFIGURACIÓN GENERAL
# =========================================================
server.port=8088
spring.application.name=admin-kafka

# =========================================================
# EUREKA CLIENT
# =========================================================
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# =========================================================
# KAFKA BOOTSTRAP SERVERS (Cluster 3 brokers)
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-1:29092,kafka-2:29092,kafka-3:29092}

# =========================================================
# KAFKA PRODUCER - Serializador JSON + acks=all
# =========================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# =========================================================
# KAFKA CONSUMER - Deserializador JSON
# =========================================================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.plataforma_lc.adminKafka.dto

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =========================================================
# LOGGING
# =========================================================
logging.level.org.apache.kafka=WARN
logging.level.com.plataforma_lc.adminKafka=INFO

