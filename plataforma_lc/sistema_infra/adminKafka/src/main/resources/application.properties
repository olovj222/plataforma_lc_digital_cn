# =========================================================
# CONFIGURACIÓN GENERAL DEL MICROSERVICIO
# =========================================================
server.port=8088
spring.application.name=admin-kafka

# =========================================================
# EUREKA SERVICE DISCOVERY CLIENT
# =========================================================
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# =========================================================
# KAFKA BOOTSTRAP SERVERS (Clúster de 3 Brokers)
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-1:29092,kafka-2:29092,kafka-3:29092}

# =========================================================
# KAFKA PRODUCER - Configuración Avanzada y Resiliente
# =========================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Compresión lz4 para optimizar ancho de banda de red en el clúster
spring.kafka.producer.compression-type=lz4
# Tiempos de espera y entrega
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.linger.ms=5

# =========================================================
# KAFKA CONSUMER - Deserialización Segura (ErrorHandlingDeserializer)
# =========================================================
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Paquetes de confianza y deshabilitación de autocommit para control transaccional
spring.kafka.consumer.properties.spring.json.trusted.packages=com.plataforma_lc.adminKafka.dto
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.session.timeout.ms=45000

# =========================================================
# KAFKA LISTENER CONTAINER - Modo de confirmación (ack-mode)
# =========================================================
spring.kafka.listener.ack-mode=record

# =========================================================
# PROPIEDADES DE DOMINIO Y ENTORNO (app.kafka.*)
# =========================================================
# Concurrencia de consumidores: 1 hilo por defecto (hasta 3 para igualar particiones)
app.kafka.consumer.concurrency=1

# Parámetros por defecto para creación de tópicos de la plataforma
app.kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.topics.replicas=${KAFKA_TOPIC_REPLICAS:3}
app.kafka.topics.min-insync-replicas=${KAFKA_TOPIC_MIN_ISR:2}

# =========================================================
# SPRING BOOT ACTUATOR & GESTIÓN
# =========================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =========================================================
# NIVELES DE LOGGING
# =========================================================
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.level.com.plataforma_lc.adminKafka=INFO
