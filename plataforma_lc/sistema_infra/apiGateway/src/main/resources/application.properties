spring.application.name=apiGateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=estudiante
spring.cloud.gateway.routes[0].uri=lb://estudiante
spring.cloud.gateway.routes[0].predicates[0]=Path=/estudiante/**

spring.cloud.gateway.routes[1].id=curso
spring.cloud.gateway.routes[1].uri=lb://curso
spring.cloud.gateway.routes[1].predicates[0]=Path=/curso/**

spring.cloud.gateway.routes[2].id=asistencia
spring.cloud.gateway.routes[2].uri=lb://asistencia
spring.cloud.gateway.routes[2].predicates[0]=Path=/asistencia/**

spring.cloud.gateway.routes[3].id=evaluaciones
spring.cloud.gateway.routes[3].uri=lb://evaluaciones
spring.cloud.gateway.routes[3].predicates[0]=Path=/evaluaciones/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/plataforma_lc

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
