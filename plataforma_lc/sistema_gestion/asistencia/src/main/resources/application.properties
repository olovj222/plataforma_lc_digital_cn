spring.application.name=asistencia
server.port=8082
ms.curso.url=${MS_CURSO_URL:http://localhost:8081}
ms.estudiante.url=${MS_ESTUDIANTE_URL:http://localhost:8080}
# Base de datos: apunta al servicio 'mysql-db' de Docker Compose
spring.datasource.url=jdbc:mysql://mysql-db:3306/asistencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=  # Coloca aquí la contraseña root si la definiste en docker-compose

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.web-application-type=servlet

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka: apunta al servicio 'eureka-server' de Docker Compose
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true

# CircuitBreaker
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.estudianteService.base-config=default
resilience4j.circuitbreaker.instances.cursoService.base-config=default


# CONFIGURACIÓN RABBITMQ
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:rabbitmq-1:5672,rabbitmq-2:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

# Nombres de Colas, Exchanges y Routing Keys — Dominio: ASISTENCIA
rabbitmq.queue.asistencia=asistencia.queue
rabbitmq.queue.asistencia.dlq=asistencia.dlq
rabbitmq.exchange.asistencia=asistencia.exchange
rabbitmq.exchange.dlx=asistencia.dlx
rabbitmq.routingkey.asistencia=asistencia.routingkey
rabbitmq.routingkey.asistencia.dlq=asistencia.dlq.routingkey

# Nombres de Colas, Exchanges y Routing Keys — Dominio: EVALUACIONES (consumer)
rabbitmq.queue.evaluaciones=evaluaciones.queue
rabbitmq.queue.evaluaciones.dlq=evaluaciones.dlq
rabbitmq.exchange.evaluaciones=evaluaciones.exchange
rabbitmq.exchange.evaluaciones.dlx=evaluaciones.dlx
rabbitmq.routingkey.evaluaciones=evaluaciones.routingkey
rabbitmq.routingkey.evaluaciones.dlq=evaluaciones.dlq.routingkey

# Simulación de caída del consumer (SIMULAR_FALLO en el mensaje => va a la DLQ)
rabbitmq.simulacion.fallos.habilitada=${RABBITMQ_SIMULACION_FALLOS_HABILITADA:false}

# ===== KAFKA (productor del stream de analítica) =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-1:29092,kafka-2:29092,kafka-3:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# No bloquear el hilo del listener de RabbitMQ si Kafka cae
spring.kafka.producer.properties.max.block.ms=5000
# El header __TypeId__ lo fija el publisher a mano
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topic.analitica-stream=${KAFKA_TOPIC_ANALITICA_STREAM:asistencia.analitica.stream}
kafka.analitica.habilitada=${KAFKA_ANALITICA_HABILITADA:true}