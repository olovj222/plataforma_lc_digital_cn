spring.application.name=asistencia
server.port=8082
ms.curso.url=${MS_CURSO_URL:http://localhost:8081}
ms.estudiante.url=${MS_ESTUDIANTE_URL:http://localhost:8080}
# Base de datos: apunta al servicio 'mysql-db' de Docker Compose
spring.datasource.url=jdbc:mysql://mysql-db:3306/asistencia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=  # Coloca aquí la contraseña root si la definiste en docker-compose

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.web-application-type=servlet

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka: apunta al servicio 'eureka-server' de Docker Compose
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true

# CircuitBreaker
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.estudianteService.base-config=default
resilience4j.circuitbreaker.instances.cursoService.base-config=default