# Configuración para usar la base de datos en memoria H2 durante los tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactivar Eureka en tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# URLs de microservicios mock/locales
ms.curso.url=http://localhost:8081
ms.estudiante.url=http://localhost:8080

# RabbitMQ en tests
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.listener.simple.auto-startup=false

# Dominio ASISTENCIA
rabbitmq.queue.asistencia=asistencia.queue
rabbitmq.queue.asistencia.dlq=asistencia.dlq
rabbitmq.exchange.asistencia=asistencia.exchange
rabbitmq.exchange.dlx=asistencia.dlx
rabbitmq.routingkey.asistencia=asistencia.routingkey
rabbitmq.routingkey.asistencia.dlq=asistencia.dlq.routingkey

# Dominio EVALUACIONES (consumer)
rabbitmq.queue.evaluaciones=evaluaciones.queue
rabbitmq.queue.evaluaciones.dlq=evaluaciones.dlq
rabbitmq.exchange.evaluaciones=evaluaciones.exchange
rabbitmq.exchange.evaluaciones.dlx=evaluaciones.dlx
rabbitmq.routingkey.evaluaciones=evaluaciones.routingkey
rabbitmq.routingkey.evaluaciones.dlq=evaluaciones.dlq.routingkey

rabbitmq.simulacion.fallos.habilitada=false
