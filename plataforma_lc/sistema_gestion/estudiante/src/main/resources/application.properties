spring.application.name=estudiante
server.port=8080
# Base de datos (apunta al contenedor mysql-db)
spring.datasource.url=jdbc:mysql://mysql-db:3306/estudiante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.web-application-type=servlet

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka (apunta al contenedor eureka-server)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# CircuitBreaker
# Integra el estado del circuito con Spring Boot Actuator.
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

# Resilience4j mirará el resultado de las últimas 10 llamadas para decidir si debe abrir o cerrar el circuito.
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
# Establece el número mínimo de llamadas necesarias para empezar a calcular errores.
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
# Define cuántas llamadas de "prueba" se permiten cuando el circuito está en estado Medio Abierto.
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
# Activa el paso automático del estado Abierto al Medio Abierto
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
# Es el tiempo que el circuito se queda "abierto" (bloqueando todo el tráfico).
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
# Es el umbral de error en porcentaje.
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# Define el tamaño del buffer interno para los eventos del circuito (como cambios de estado).
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.estudianteService.base-config=default

# Habilitar integración con Azure AD
spring.cloud.azure.active-directory.enabled=true

# Client ID del registro del API en Entra ID
spring.cloud.azure.active-directory.credential.client-id=70af68d7-f0b7-4897-9d64-4a0b0791ca70

# ID URI exacto que coincide con la audiencia del token
spring.cloud.azure.active-directory.app-id-uri=70af68d7-f0b7-4897-9d64-4a0b0791ca70

# Emisor v1.0 exacto que emite Entra ID para tu tenant
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/2dcf78c8-4359-4115-8b06-50c5a455e4e0/

# Tenant ID
spring.cloud.azure.active-directory.profile.tenant-id=2dcf78c8-4359-4115-8b06-50c5a455e4e0
# Comunicación entre servicios (apunta al nombre del contenedor en Docker)
ms.curso.url=http://curso:8081