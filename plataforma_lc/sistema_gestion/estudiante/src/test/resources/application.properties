# Configuración para usar la base de datos en memoria H2 durante los tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactivar Eureka en tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# RabbitMQ en tests
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.listener.simple.auto-startup=false

rabbitmq.queue.anotaciones=anotaciones.queue
rabbitmq.queue.anotaciones.dlq=anotaciones.dlq
rabbitmq.exchange.anotaciones=anotaciones.exchange
rabbitmq.exchange.anotaciones.dlx=anotaciones.dlx
rabbitmq.routingkey.anotaciones=anotaciones.routingkey
rabbitmq.routingkey.anotaciones.dlq=anotaciones.dlq.routingkey
rabbitmq.simulacion.fallos.habilitada=false