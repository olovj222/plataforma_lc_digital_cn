# Perfil "test": se SUMA al application.properties de main (no lo reemplaza)

# Base de datos en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# El main fija MySQLDialect; hay que sobrescribirlo o H2 recibiría SQL de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

ms.curso.url=http://localhost:8081
ms.estudiante.url=http://localhost:8080

# Sin Eureka real durante los tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false