spring.application.name=justificativos

server.port=8086

# Base de datos (apunta al contenedor mysql-db)
spring.datasource.url=jdbc:mysql://mysql-db:3306/justificativos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.web-application-type=servlet

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka (apunta al contenedor eureka-server)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# CircuitBreaker (mismo default que el resto de los servicios)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.justificativosService.base-config=default


# CONFIGURACIÓN RABBITMQ
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:rabbitmq-1:5672,rabbitmq-2:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

# Nombres de Colas, Exchanges y Routing Keys del Dominio
# CONFIGURACIÓN RABBITMQ EN JUSTIFICATIVOS
rabbitmq.queue.justificativos=justificativos.queue
rabbitmq.queue.justificativos.dlq=justificativos.dlq
rabbitmq.exchange.asistencia=asistencia.exchange
rabbitmq.exchange.dlx=asistencia.dlx
rabbitmq.routingkey.asistencia=asistencia.routingkey
rabbitmq.routingkey.asistencia.dlq=asistencia.dlq.routingkey