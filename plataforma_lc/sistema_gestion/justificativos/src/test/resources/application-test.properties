# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:justificativos_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar Service Discovery en tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Kafka (evita PlaceholderResolutionException en KafkaProducerConfig)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

# RabbitMQ (evita errores al instanciar RabbitTemplate / RabbitMQConfig)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.auto-startup=false