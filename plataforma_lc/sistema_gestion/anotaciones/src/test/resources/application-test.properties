# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:anotaciones_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar Eureka en tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# RabbitMQ (evita auto-arranque de listeners y resuelve colas)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.auto-startup=false
rabbitmq.queue.anotaciones=test.anotaciones.queue

# Kafka (en caso de publicar eventos de auditoría)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false